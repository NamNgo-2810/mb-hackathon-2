<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Điều hướng sau cuộc gọi - MB Advance</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="h-screen w-full bg-black/40 flex items-center justify-center">
  <!--
    Lựa chọn điều hướng sau khi lưu hồ sơ cuộc gọi (S4, BR6.1/AC2.4.4). Thông
    thường hộp thoại này mở ngay trong S3 sau khi lưu; trang độc lập này phục vụ
    điều hướng trực tiếp (?callId=&leadId=). Nguồn UI: root 4-lua-chon-dieu-huong.html.
  -->
  <div class="bg-white rounded-xl shadow-2xl w-[400px] p-6 space-y-3" role="dialog" aria-modal="true" aria-labelledby="s4-title" data-testid="s4-standalone">
    <div class="text-center">
      <div class="w-12 h-12 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center mx-auto mb-2"><i class="fa-solid fa-check text-xl"></i></div>
      <h2 id="s4-title" class="text-sm font-bold text-slate-900">Đã lưu hồ sơ cuộc gọi thành công!</h2>
      <p class="text-[11px] text-slate-500 mt-1">Chọn bước tiếp theo</p>
    </div>
    <button type="button" id="s4-next-lead" data-testid="s4-next-lead" class="w-full py-2.5 px-3 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-semibold text-left flex items-center gap-2"><i class="fa-solid fa-user-plus"></i> Liên hệ khách hàng tiếp theo</button>
    <button type="button" id="s4-calendar" data-testid="s4-calendar" class="w-full py-2.5 px-3 bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 rounded-lg text-xs font-semibold text-left flex items-center gap-2"><i class="fa-regular fa-calendar text-blue-600"></i> Chi tiết lịch làm việc</button>
    <button type="button" id="s4-home" data-testid="s4-home" class="w-full py-2.5 px-3 bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 rounded-lg text-xs font-semibold text-left flex items-center gap-2"><i class="fa-solid fa-house text-slate-500"></i> Đóng &amp; Quay lại trang chủ</button>
    <div id="s4-note" class="hidden text-[11px] text-amber-700 bg-amber-50 border border-amber-200 rounded px-2 py-1" data-testid="s4-note"></div>
  </div>

  <script type="module">
    import { getNextLead } from '/js/api.js';
    import { queryParam } from '/js/screens.js';

    const callId = queryParam('callId');
    const leadId = queryParam('leadId');

    document.getElementById('s4-next-lead').addEventListener('click', async () => {
      try {
        const next = await getNextLead(leadId);
        if (!next) {
          const n = document.getElementById('s4-note');
          n.textContent = 'Bạn đã liên hệ hết tiềm năng bán cần xử lý.';
          n.classList.remove('hidden');
          setTimeout(() => { window.location.href = '/screens/leads-list.html'; }, 1200);
          return;
        }
        window.location.href = `/screens/1-chi-tiet-tiem-nang-ban.html?${new URLSearchParams({ leadId: next.leadId }).toString()}`;
      } catch (e) {
        const n = document.getElementById('s4-note');
        n.textContent = e.message || 'Không lấy được lead kế tiếp';
        n.classList.remove('hidden');
      }
    });
    document.getElementById('s4-calendar').addEventListener('click', () => {
      window.location.href = `/screens/5-lich-lam-viec.html?${new URLSearchParams(callId ? { sourceCallId: callId } : {}).toString()}`;
    });
    document.getElementById('s4-home').addEventListener('click', () => { window.location.href = '/screens/leads-list.html'; });
  </script>
</body>
</html>
