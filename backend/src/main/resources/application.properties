# CRM Call Assistant backend — configuration (properties form).
# EVERY secret/endpoint still resolves from the environment first (NFR3);
# the values after ":" are safe local-demo defaults. Edit this file OR set the
# matching env var — the env var wins.

server.port=8080

spring.application.name=call-assistant
# Local secrets (git-ignored) override the placeholders below; env vars also work.
spring.config.import=optional:classpath:application-secrets.properties
# Default profile uses PostgreSQL (docker compose). Activate "demo" for H2 + seed data.
spring.profiles.active=default
# Set the limit to 10MB (or -1 for unlimited)
spring.http.codecs.max-in-memory-size=10485760

# --- Database (default profile: Postgres from docker compose) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/callassistant
spring.datasource.username=callassistant
spring.datasource.password=${DB_PASSWORD:callassistant}

# Auto-DDL for the demo; use migrations (Flyway) in production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# --- Recording server (FreeSWITCH/EC2): two endpoints, see RECORDING-SETUP.md ---
# GET <base>/api/recordings/latest  and  GET <base>/api/recordings/download/:name
app.recording.base-url=http://32.236.141.36:80
app.recording.api-key=${RECORDING_API_KEY:}
# Bounded retry/backoff for a .wav that is a moment late after hangup (FR3.2).
app.recording.retry-max-attempts=${RECORDING_RETRY_MAX_ATTEMPTS:6}
app.recording.retry-delay-ms=${RECORDING_RETRY_DELAY_MS:1500}
# Max bytes to buffer when downloading a recording .wav (WebClient default is only 256 KB).
app.recording.max-download-bytes=${RECORDING_MAX_DOWNLOAD_BYTES:67108864}

# --- Speech-to-text (Vietnamese) ---
# provider: google (Google Cloud Speech-to-Text, default) or whisper (self-hosted).
app.stt.provider=google
app.stt.base-url=https://speech.googleapis.com
app.stt.api-key=${STT_API_KEY:}
# Which stereo channel is the RM (agent): left|right. Other channel = KH.
# Default left=RM, right=KH; flip to right if the legs are reversed (FR4.2) — no code change.
app.stt.rm-channel=${STT_RM_CHANNEL:left}

# --- LLM gateway (U2, shared Anthropic Claude client, ADR-004 / I3) ---
# provider: anthropic (real Claude Messages API, default) or mock (canned, offline — demo/test).
app.llm.provider=${LLM_PROVIDER:anthropic}
# Claude model id — chosen by the operator when a key is set (NFR2.3; no hardcoded default).
app.llm.model=${ANTHROPIC_MODEL:}
# Provider base URL; must be https for the real provider (NFR2.9).
app.llm.base-url=${ANTHROPIC_BASE_URL:https://api.anthropic.com}
# Anthropic Messages API version header.
app.llm.anthropic-version=${ANTHROPIC_VERSION:2023-06-01}
# Default per-call timeout (ms) when a request omits one (BR3.1/NFR1.1).
app.llm.default-timeout-ms=${LLM_DEFAULT_TIMEOUT_MS:30000}
# Upper bound for a request's maxOutputTokens (BR2.2).
app.llm.max-output-tokens-cap=${LLM_MAX_OUTPUT_TOKENS_CAP:4096}
# NOTE: the API key is NOT a property — it is read directly from ANTHROPIC_API_KEY
# in the adapter (BR1.1/NFR2.1). Missing key => NOT_CONFIGURED, app still starts.

# --- Copilot (U3, tra cứu chính sách, hợp đồng C2) ---
# Thư mục chứa file chính sách text/md đã trích (BR1.1); nạp một lần lúc khởi động.
app.copilot.docs-dir=${COPILOT_DOCS_DIR:backend/policy-docs}
# Số đoạn tối đa nhúng vào prompt (BR2.2).
app.copilot.top-k=${COPILOT_TOP_K:5}
# Số lượt lịch sử tối đa nhận từ giao diện mỗi yêu cầu (BR6.2).
app.copilot.max-history-turns=${COPILOT_MAX_HISTORY_TURNS:10}
# Độ dài tối đa của câu hỏi (BR7.2).
app.copilot.max-question-length=${COPILOT_MAX_QUESTION_LENGTH:1000}
# Timeout mỗi lần gọi LLM, ms (BR5.1: quá 30 giây thì báo lỗi).
app.copilot.llm-timeout-ms=${COPILOT_LLM_TIMEOUT_MS:30000}
# maxOutputTokens truyền cho LlmClient khi sinh câu trả lời (BR5.1).
app.copilot.max-output-tokens=${COPILOT_MAX_OUTPUT_TOKENS:1024}

# --- Call Analysis (U4, bước ANALYZE của pipeline, I2/I3) ---
# Ngưỡng xếp hạng cấu hình được (BR3.3): A ≥ a, B ≥ b, C ≥ c, D < c.
app.analysis.grade-threshold-a=${ANALYSIS_GRADE_A:85}
app.analysis.grade-threshold-b=${ANALYSIS_GRADE_B:70}
app.analysis.grade-threshold-c=${ANALYSIS_GRADE_C:50}
# Timeout gọi LLM phân tích (ms) và trần token đầu ra (BR8.2/NFR1).
app.analysis.llm-timeout-ms=${ANALYSIS_LLM_TIMEOUT_MS:30000}
app.analysis.max-output-tokens=${ANALYSIS_MAX_OUTPUT_TOKENS:2048}
# Dự phòng chờ ghi âm/transcript khi NO_RECORDING (AC2.4.1).
app.analysis.recording-wait-max-attempts=${ANALYSIS_RECORDING_WAIT_MAX_ATTEMPTS:6}
app.analysis.recording-wait-ms=${ANALYSIS_RECORDING_WAIT_MS:1500}

# --- CORS: origins allowed to call this backend from the browser ---
app.cors.allowed-origins=${FRONTEND_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# --- Auth mode (ADR-007, BR1.3): demo (fixed sample RM, no token) or login (U6, Bearer token) ---
app.auth.mode=${AUTH_MODE:demo}
# Thời hạn phiên đăng nhập (giờ), cấu hình được (BR2.1). Chỉ dùng ở chế độ login.
app.auth.session-ttl-hours=${AUTH_SESSION_TTL_HOURS:8}
# (Tùy chọn, BR5.2) Độ trễ cố định (ms) cho phản hồi đăng nhập sai; 0 = tắt.
app.auth.fail-delay-ms=${AUTH_FAIL_DELAY_MS:0}

logging.level.com.mb.callassistant=INFO
