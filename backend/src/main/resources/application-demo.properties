# Demo profile: zero-infra H2 in-memory DB + mock seed data.
# Activate with SPRING_PROFILES_ACTIVE=demo (no Docker, no EC2 needed to click the UI).

spring.datasource.url=jdbc:h2:mem:callassistant;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Demo profile always resolves the fixed sample RM (ADR-007, BR1.3).
app.auth.mode=demo

# LLM: default the demo to the offline MOCK provider so the UI works with no
# ANTHROPIC_API_KEY (BR6.1 / NFR3.4). Override LLM_PROVIDER=anthropic + set
# ANTHROPIC_API_KEY/ANTHROPIC_MODEL to demo the real Claude gateway.
app.llm.provider=${LLM_PROVIDER:mock}

# --- Copilot (U3): thư mục tài liệu + tham số tra cứu (hợp đồng C2) ---
# Demo nạp tài liệu mẫu trong backend/policy-docs; MOCK LLM nên chạy offline được.
app.copilot.docs-dir=${COPILOT_DOCS_DIR:backend/policy-docs}
app.copilot.top-k=${COPILOT_TOP_K:5}
app.copilot.max-history-turns=${COPILOT_MAX_HISTORY_TURNS:10}
app.copilot.max-question-length=${COPILOT_MAX_QUESTION_LENGTH:1000}
app.copilot.llm-timeout-ms=${COPILOT_LLM_TIMEOUT_MS:30000}
app.copilot.max-output-tokens=${COPILOT_MAX_OUTPUT_TOKENS:1024}

# --- Call Analysis (U4): ngưỡng xếp hạng + timeout; MOCK để chạy offline ---
app.analysis.grade-threshold-a=${ANALYSIS_GRADE_A:85}
app.analysis.grade-threshold-b=${ANALYSIS_GRADE_B:70}
app.analysis.grade-threshold-c=${ANALYSIS_GRADE_C:50}
app.analysis.llm-timeout-ms=${ANALYSIS_LLM_TIMEOUT_MS:30000}
app.analysis.max-output-tokens=${ANALYSIS_MAX_OUTPUT_TOKENS:2048}
app.analysis.recording-wait-max-attempts=${ANALYSIS_RECORDING_WAIT_MAX_ATTEMPTS:6}
app.analysis.recording-wait-ms=${ANALYSIS_RECORDING_WAIT_MS:1500}
